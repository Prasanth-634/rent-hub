services:
  # Rent Hub Backend FastAPI Service
  - type: web
    name: rent-hub-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: CORS_ORIGINS
        value: "https://rent-hub-mauve.vercel.app,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
      - key: JWT_SECRET
        generateValue: true
      - key: API_V1_STR
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: rent-hub-db
          property: connectionString

# Render PostgreSQL Database
databases:
  - name: rent-hub-db
    databaseName: rent_verification
    user: rent_user
